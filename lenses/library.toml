# Our own word library: which ordinary words are nouns, verbs, adjectives and adverbs.
#
# The grammar layer reads this wherever the language model (spaCy) is not there, which
# includes the chat add-on. It is plain data: add a word to a list and it takes that look.
# A word nobody listed is treated as a noun unless its ending says otherwise (-ly adverb,
# -ous/-ful/-able adjective, -ed/-ing verb form, and so on).
#
# After editing, run:  python tools/export_lens.py   (bakes the library into the chat add-on)

# ---------------------------------------------------------------------------
# The owner's own words. A word or phrase pinned here always takes this look,
# over every rule below and over the language model too.
# Values: noun, verb, adjective, adverb, or skip (never styled).
# ---------------------------------------------------------------------------
[own]
"wait list" = "noun"
"wait-list" = "noun"
"visit type" = "noun"
"record viewer" = "noun"
"encounter" = "noun"

# ---------------------------------------------------------------------------
# Small words. They get no look of their own, but they tell the tagger what
# the next word is: "the list" is a noun, "to list" is a verb.
# ---------------------------------------------------------------------------
[function]
# articles and possessives: the next word is a thing
determiners = "the a an my your his her its our their"
# counting and pointing words
quantifiers = "each every either neither another any some no such what whose several many few much more most less least other others own same"
# pointing at several things: a verb can follow ("both show", "these work")
plural = "these those both all"
prepositions = "of in on at by for with from into onto over under about after before between through during without within against among across behind beyond per via upon toward towards near inside outside off above below along around despite except like as than until since up down out"
to = "to"
subjects = "i you we they"
objects = "me us them him"
third = "he she it"
pointers = "that which who this"
# a verb comes next; these are not styled themselves
preverb = "let's i'll you'll we'll they'll he'll she'll it'll i'd you'd we'd they'd"
softeners = "please"
negation = "not"
skip = """
and or but nor so yet if because while although though unless whether when where why how whom
one two three four five six seven eight nine ten eleven twelve twenty thirty forty fifty
hundred thousand million billion first second third fourth fifth zero
yes ok okay hi hello hey thanks etc vs eg ie am pm
myself yourself himself herself itself ourselves themselves
something anything nothing everything someone anyone everyone nobody somebody anybody everybody none
mine yours hers ours theirs whatever whichever whoever
i'm i've you're you've we're we've they're they've he's she's it's that's there's here's what's who's
"""

# Helping verbs. They take the verb look, and the word after a modal is a verb.
[aux]
modal = "can could will would shall should may might must do does did cannot can't couldn't won't wouldn't shouldn't don't doesn't didn't mustn't"
be = "be is are was were been being have has had having isn't aren't wasn't weren't haven't hasn't hadn't doing done"

