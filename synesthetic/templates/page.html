<!doctype html>
<html lang="en" data-theme="dark" data-pal="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{FONT_LINKS}}
<style>
{{CSS_VARS}}
:root{--bg:#14161b;--fg:#e6e8ec;--muted:#8b93a1;--line:#2a2f3a;--panel:#1b1e25;--head:#f4f6fa;--th:#222733;--accent:#6cb4ff}
:root[data-theme=light]{--bg:#fbfbf8;--fg:#1d2026;--muted:#5d6572;--line:#d9dce2;--panel:#f1f2ee;--head:#0d0f13;--th:#e9ebf0;--accent:#1a5fb4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;color:var(--fg);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--bg);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.leg{width:100%}
details.leg summary{cursor:pointer;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;padding:8px 0 2px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.lg .lh{font-weight:600;min-width:7.5em}
.legend label{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.legend .n{color:var(--muted);font-size:12px}
main{max-width:860px;margin:0 auto;padding:22px 16px 80px}
.file{color:var(--muted);font-size:13px;margin:0 0 6px;word-break:break-all}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px;color:var(--muted)}
h1,h2,h3,h4,h5,h6{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;color:var(--head);line-height:1.25;margin:1.6em 0 .5em;font-weight:700}
h1{font-size:2em;border-bottom:2px solid var(--line);padding-bottom:.25em}
h2{font-size:1.5em;border-left:4px solid var(--accent);padding-left:.55em}
h3{font-size:1.2em}
h4{font-size:1.05em;text-transform:uppercase;letter-spacing:.05em}
h5,h6{font-size:1em;color:var(--muted)}
p{margin:.7em 0}
.li{display:flex;gap:.6em;margin:.25em 0;padding-left:calc(var(--lvl,0)*1.4em)}
.li .mk{color:var(--muted);min-width:1.4em;text-align:right;flex:none}
.li .tx{min-width:0}
blockquote{margin:.9em 0;padding:.2em 1em;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
/* a formula on its own: centered in a math face inside a double ring in the page's accent */
.fx{margin:1.1em 0;padding:14px 22px;text-align:center;overflow-x:auto;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--panel));box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px color-mix(in srgb,var(--accent) 35%,var(--line))}
.fx .fxl{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fx .fxm{display:block;font:1.2em/1.45 "Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif;letter-spacing:.03em}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:14px/1.5 ui-monospace,Consolas,monospace}
code{font:.92em ui-monospace,Consolas,monospace;background:var(--panel);padding:.05em .3em;border-radius:4px}
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--th);font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pg{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:2em 0 .6em;text-transform:uppercase;letter-spacing:.08em}
.pg::after{content:"";flex:1;border-top:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
.c{border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.m-a .c{color:var(--c)}
.m-b .c{background:var(--c);color:var(--on);padding:.04em .38em}
.m-c .c{color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);padding:.04em .3em;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 70%,transparent)}
.m-d .c{color:inherit;background:none;padding:0;text-decoration-line:underline;text-decoration-color:var(--ul,var(--c));text-decoration-thickness:3px;text-underline-offset:.22em}
body.sp-roomy{letter-spacing:.03em;word-spacing:.1em;line-height:1.95}
body.sp-roomy p,body.sp-roomy .li{margin-bottom:1.1em}
{{CAT_CSS}}
@media (max-width:560px){body{font-size:16px}.bar{padding:8px 10px}main{padding:16px 12px 70px}}
@media print{.bar{display:none}}
{{CUSTOM_CSS}}
</style>
</head>
<body class="m-{{MODE}}">
<div class="bar" role="toolbar" aria-label="Display options">
  <span class="lbl">Style</span>
  <div class="seg" data-k="mode">
    <button type="button" data-v="a">Colored text</button>
    <button type="button" data-v="b">Highlights</button>
    <button type="button" data-v="c">Combined</button>
    <button type="button" data-v="d" title="Plain text with a colored underline">Underline only</button>
  </div>
  <span class="lbl">Spacing</span>
  <div class="seg" data-k="sp">
    <button type="button" data-v="normal">Normal</button>
    <button type="button" data-v="roomy">Roomy</button>
  </div>
  <span class="lbl">Theme</span>
  <div class="seg" data-k="theme">
    <button type="button" data-v="dark">Dark</button>
    <button type="button" data-v="light">Light</button>
    <button type="button" data-v="auto">Auto</button>
  </div>
  <span class="lbl">Palette</span>
  <div class="seg" data-k="pal">
    <button type="button" data-v="default">Standard</button>
    <button type="button" data-v="cb">Color-blind safe</button>
  </div>
  <details class="leg"><summary>Legend and filters</summary>
    <div class="legend">{{LEGEND}}</div>
  </details>
</div>
<main>
<p class="file">{{SOURCE}}</p>
{{NOTES}}
{{BODY}}
</main>
<script>
(function(){
  var D={{DEFAULTS}};
  var root=document.documentElement, body=document.body;
  function get(k,d){try{var v=localStorage.getItem('syn.'+k);return v===null?d:v}catch(e){return d}}
  function set(k,v){try{localStorage.setItem('syn.'+k,v)}catch(e){}}
  var st={mode:get('mode',D.mode),theme:get('theme',D.theme),pal:get('pal',D.palette),sp:get('sp','normal')};
  var off=(D.off||[]).slice();try{var so=get('off',null);if(so!==null)off=JSON.parse(so)||[]}catch(e){}
  var mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function apply(){
    ['a','b','c','d'].forEach(function(m){body.classList.remove('m-'+m)});
    body.classList.add('m-'+st.mode);
    body.classList.toggle('sp-roomy',st.sp==='roomy');
    var t=st.theme==='auto'?((mq&&mq.matches)?'light':'dark'):st.theme;
    root.setAttribute('data-theme',t);root.setAttribute('data-pal',st.pal);
    document.querySelectorAll('.seg').forEach(function(g){
      var k=g.getAttribute('data-k');
      g.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===st[k]?'true':'false')});
    });
    document.querySelectorAll('.legend input').forEach(function(cb){
      var n=cb.getAttribute('data-c');var isOff=off.indexOf(n)>=0;
      cb.checked=!isOff;body.classList.toggle('off-'+n,isOff);
    });
  }
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.parentNode.getAttribute('data-k');st[k]=b.getAttribute('data-v');set(k,st[k]);apply();
    });
  });
  document.querySelectorAll('.legend input').forEach(function(cb){
    cb.addEventListener('change',function(){
      var n=cb.getAttribute('data-c');var i=off.indexOf(n);
      if(cb.checked&&i>=0)off.splice(i,1);if(!cb.checked&&i<0)off.push(n);
      set('off',JSON.stringify(off));apply();
    });
  });
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(st.theme==='auto')apply()});
  apply();
})();
</script>
</body>
</html>
