<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Synesthetic Layer</title>
<style>
:root{color-scheme:dark;--bg:#14161b;--fg:#e6e8ec;--muted:#8b93a1;--line:#2a2f3a;--panel:#1b1e25;--panel2:#222733;--accent:#6cb4ff;--on-accent:#0b1220;--err:#ff8f8f;
  --c1:#ffb347;--c2:#7ee0a1;--c3:#6cb4ff;--c4:#e58cff;--c5:#ff8f8f}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#fbfbf8;--fg:#1d2026;--muted:#5d6572;--line:#d9dce2;--panel:#f1f2ee;--panel2:#e7e9e3;--accent:#1a5fb4;--on-accent:#ffffff;--err:#b3261e;
  --c1:#a35a00;--c2:#1f7a45;--c3:#1a5fb4;--c4:#8a2ca8;--c5:#b3261e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
.wrap{width:min(560px,100%);margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:1.9em;line-height:1.15;margin:0 0 6px}
h1 .l1{color:var(--c1)}h1 .l2{color:var(--c3)}
.sub{color:var(--muted);margin:0 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px;font-size:15px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel2);color:var(--fg);font-weight:650}
.tabs button:focus-visible,.btn:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:170px;border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--panel2)}
.drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.drop .big{font-weight:650;font-size:1.05em;word-break:break-word}
.drop .small{color:var(--muted);font-size:14px}
.drop.has{border-style:solid;border-color:var(--accent)}
textarea{width:100%;min-height:200px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.opts{margin:16px 2px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt small{display:block;color:var(--muted);font-size:13px}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;cursor:pointer;padding:15px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn[aria-disabled=true]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600;padding:9px 14px;width:auto;border-radius:10px;font-size:15px}
#msg{margin-top:12px;min-height:1.5em;font-size:15px}
#msg.err{color:var(--err)}
.foot{margin-top:28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.foot p{margin:.3em 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#result{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#result.on{display:flex}
.rbar{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel)}
.rbar .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="form">
  <h1><span class="l1">Synesthetic</span> <span class="l2">Layer</span></h1>
  <p class="sub">Turn a document into a page with color, font and highlight styling.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-file" aria-selected="true" aria-controls="p-file">File</button>
    <button role="tab" id="t-text" aria-selected="false" aria-controls="p-text">Paste text</button>
  </div>

  <div id="p-file" role="tabpanel" aria-labelledby="t-file">
    <label class="drop" id="drop">
      <input id="f" type="file">
      <span class="big" id="fname">Tap to choose a file</span>
      <span class="small" id="fmeta">or drop it here</span>
    </label>
  </div>
  <div id="p-text" role="tabpanel" aria-labelledby="t-text" hidden>
    <textarea id="txt" placeholder="Paste text or Markdown here" aria-label="Text to convert"></textarea>
  </div>

  <div class="opts">
    <label class="opt" id="o-grammar" hidden><input id="grammar" type="checkbox"><span>Grammar layer<small>Colors nouns, verbs, adjectives and adverbs. Busier page.</small></span></label>
    <label class="opt" id="o-fast" hidden><input id="fast" type="checkbox"><span>Fast PDF<small>Skips table detection. Use it if a big PDF is slow.</small></span></label>
  </div>

  <div class="btn" id="go" role="button" tabindex="0" aria-disabled="true">Convert</div>
  <div id="msg" role="status" aria-live="polite"></div>

  <div class="foot" id="foot"></div>
</div>

<div id="result" aria-label="Converted page">
  <div class="rbar">
    <button class="btn ghost" id="back">Back</button>
    <span class="name" id="rname"></span>
    <a class="btn ghost" id="dl" download>Save</a>
    <a class="btn ghost" id="open" target="_blank" rel="noopener">Open</a>
  </div>
  <iframe id="frame" title="Converted page"></iframe>
</div>

<script id="cfg" type="application/json">{{CONFIG}}</script>
<script>
(function(){
  var cfg = JSON.parse(document.getElementById('cfg').textContent);
  var $ = function(id){ return document.getElementById(id); };
  var f = $('f'), drop = $('drop'), txt = $('txt'), go = $('go'), msg = $('msg');
  var mode = 'file', file = null, busy = false, url = null;

  f.accept = cfg.exts.join(',');
  $('o-grammar').hidden = !cfg.grammar;
  $('foot').innerHTML =
    '<p>Reads ' + cfg.exts.join(', ') + '. Up to ' + mb(cfg.maxBytes) + ' per file.</p>' +
    '<p>' + (cfg.hosted ? 'The file is converted on the server and not stored.' : 'Runs on this computer. Nothing leaves it.') + '</p>' +
    '<p>On the page: switch style, spacing, theme and palette at the top; the legend turns categories on or off.</p>';

  function mb(n){ return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; }
  function ext(name){ var i = name.lastIndexOf('.'); return i < 0 ? '' : name.slice(i).toLowerCase(); }
  function say(t, err){ msg.className = err ? 'err' : ''; msg.textContent = t; }
  function ready(){
    var ok = mode === 'file' ? !!file : txt.value.trim().length > 0;
    go.setAttribute('aria-disabled', ok && !busy ? 'false' : 'true');
    $('o-fast').hidden = !(mode === 'file' && file && ext(file.name) === '.pdf');
  }
  function setTab(m){
    mode = m;
    $('t-file').setAttribute('aria-selected', m === 'file');
    $('t-text').setAttribute('aria-selected', m === 'text');
    $('p-file').hidden = m !== 'file';
    $('p-text').hidden = m !== 'text';
    say(''); ready();
    if (m === 'text') txt.focus();
  }
  $('t-file').onclick = function(){ setTab('file'); };
  $('t-text').onclick = function(){ setTab('text'); };

  function pick(fl){
    say('');
    if (!fl) return;
    if (cfg.exts.indexOf(ext(fl.name)) < 0){
      file = null; drop.classList.remove('has');
      $('fname').textContent = 'Tap to choose a file'; $('fmeta').textContent = 'or drop it here';
      say('That type is not supported. Use ' + cfg.exts.join(', ') + '.', true); ready(); return;
    }
    file = fl; drop.classList.add('has');
    $('fname').textContent = fl.name;
    $('fmeta').textContent = mb(fl.size) + (fl.size > cfg.maxBytes ? ', too large' : '');
    if (fl.size > cfg.maxBytes) say('This file is larger than the ' + mb(cfg.maxBytes) + ' limit here. Convert it on your computer instead.', true);
    ready();
  }
  f.onchange = function(){ pick(f.files[0]); };
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function(e){ if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
  txt.oninput = ready;

  async function convert(){
    if (go.getAttribute('aria-disabled') === 'true') return;
    var name, body;
    if (mode === 'file'){ name = file.name; body = file; }
    else { name = 'Pasted text.md'; body = new Blob([txt.value], {type: 'text/markdown'}); }
    if (body.size > cfg.maxBytes){ say('Too large: the limit here is ' + mb(cfg.maxBytes) + '.', true); return; }
    busy = true; ready();
    msg.className = ''; msg.innerHTML = '<span class="spin" aria-hidden="true"></span>Converting...';
    try {
      var q = 'grammar=' + ($('grammar').checked ? 1 : 0) + '&fast=' + ($('fast').checked ? 1 : 0);
      var r = await fetch('/api/convert?' + q, {method: 'POST', body: body, headers: {'X-File-Name': encodeURIComponent(name)}});
      var t = await r.text();
      if (!r.ok){
        var plain = (r.headers.get('content-type') || '').indexOf('text/plain') === 0;
        if (r.status === 413) t = 'Too large for this server. Convert it on your computer instead.';
        else if (r.status === 504) t = 'The server took too long. Try Fast PDF, or a smaller file.';
        else if (!plain) t = 'Conversion failed (error ' + r.status + ').';
        say(t, true); return;
      }
      show(t, name);
      say('');
    } catch (e) {
      say('Could not reach the server: ' + e.message, true);
    } finally { busy = false; ready(); }
  }
  go.onclick = convert;
  go.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); convert(); } };

  function show(html, name){
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
    $('frame').src = url;
    $('dl').href = url; $('dl').download = name.replace(/\.[^.]+$/, '') + '.html';
    $('open').href = url;
    $('rname').textContent = name;
    $('result').classList.add('on');
    document.body.style.overflow = 'hidden';
    history.pushState({result: 1}, '');
  }
  function hide(){ $('result').classList.remove('on'); document.body.style.overflow = ''; }
  $('back').onclick = function(){ history.state && history.state.result ? history.back() : hide(); };
  window.addEventListener('popstate', hide);
})();
</script>
</body>
</html>
