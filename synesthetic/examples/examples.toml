# Sample documents shown under "Try an example" in the web app.
# Every name, number and address in them is made up. Each blurb names a few real items from its
# document, so the blurb itself shows the colors when the app colors its own text.

[[example]]
file = "study-notes.md"
title = "Study notes"
blurb = "Definitions, Figure 4.7, page 112 and the exam on Oct 14. Grammar layer on."
grammar = true

[[example]]
file = "lease.md"
title = "Lease or contract"
blurb = "Rent of $1,450 due Sep 1, Section 12 and what's required or prohibited."

[[example]]
file = "aftercare.md"
title = "Care instructions"
blurb = "Doses like 400 mg, times like 2:30 PM, and the do not lines."

[[example]]
file = "meeting-notes.md"
title = "Work email"
blurb = "Ticket WEB-2291, due Nov 18, links and design@example.com."

[[example]]
